name: GLPI 12 native integration

on:
  push:
    branches: [glpi-v12]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: glpi
          MARIADB_USER: glpi
          MARIADB_PASSWORD: glpi-disposable
          MARIADB_ROOT_PASSWORD: root-disposable
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, mysqli, simplexml, sodium, zip
          coverage: none
      - name: Install disposable GLPI 12.0.1
        run: |
          curl --fail --location --output glpi.tgz \
            https://github.com/glpi-project/glpi/releases/download/12.0.1/glpi-12.0.1.tgz
          tar -xzf glpi.tgz
          php glpi/bin/console database:install \
            --db-host=127.0.0.1 --db-name=glpi --db-user=glpi --db-password=glpi-disposable \
            --no-telemetry --no-interaction
          touch glpi/.tinisys-disposable-test
      - name: Install and activate plugin
        run: |
          mv plugin-source glpi/plugins/ticketmigration
          composer install --working-dir=glpi/plugins/ticketmigration --no-dev --no-interaction --prefer-dist
          php glpi/bin/console plugin:install --username=glpi --no-interaction ticketmigration
          php glpi/bin/console plugin:activate --no-interaction ticketmigration
      - name: Check native models and initialization
        run: GLPI_TEST_ROOT="$PWD/glpi" php glpi/plugins/ticketmigration/tests/Integration/glpi12.php
      - name: Check plugin lifecycle
        run: |
          php glpi/bin/console plugin:deactivate --no-interaction ticketmigration
          php glpi/bin/console plugin:uninstall --no-interaction ticketmigration
